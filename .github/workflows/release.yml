name: Release

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZPK_HOST: zpk.w7.cc
      ZPK_ARTIFACT: w7-sitemanager
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'zpk.w7.cc' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm
          cache-dependency-path: ui/site/package-lock.json

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools zip

      - name: Build frontend
        working-directory: ui/site
        run: |
          npm install
          npm run build

      - name: Package frontend
        run: |
          set -euo pipefail

          if [ ! -d ui/site/dist ]; then
            echo "frontend dist not found under ui/site/dist"
            exit 1
          fi

          cd ui/site/dist
          zip -r ../../../frontend.zip .

      - name: Docker login
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Publish image and Helm package
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          make publish IMAGE_TAG="${RELEASE_TAG}" HELM_CHART_VERSION="${RELEASE_VERSION}" HELM_APP_VERSION="${RELEASE_TAG}"

      - name: Push zpk
        env:
          ZPK_DOCKER_USERNAME: ${{ secrets.ZPK_DOCKER_USERNAME }}
          ZPK_DOCKER_PASSWORD: ${{ secrets.ZPK_DOCKER_PASSWORD }}
        run: |
          sudo curl -L --fail -o /usr/local/bin/zpk https://github.com/w7panel/w7panel-zpk/releases/download/latest/zpk_linux_amd64
          sudo chmod +x /usr/local/bin/zpk
          
          set -euo pipefail

          if [ -z "${ZPK_DOCKER_USERNAME}" ]; then
            echo "ZPK_DOCKER_USERNAME secret is required"
            exit 1
          fi
          if [ -z "${ZPK_DOCKER_PASSWORD}" ]; then
            echo "ZPK_DOCKER_PASSWORD secret is required"
            exit 1
          fi

          HELM_PACKAGE="$(ls charts/site-manager-*.tgz | head -n 1)"
          if [ -z "${HELM_PACKAGE}" ]; then
            echo "helm package not found under charts/"
            exit 1
          fi

          zpk login --username="${ZPK_DOCKER_USERNAME}" --password="${ZPK_DOCKER_PASSWORD}" --host="${ZPK_HOST}"
          zpk use --name="${ZPK_ARTIFACT}"
          zpk attach add --path="${HELM_PACKAGE}" --type=helm
          zpk attach add --path="frontend.zip" --type=frontend
          zpk push

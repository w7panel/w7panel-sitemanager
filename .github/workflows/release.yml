name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZPK_HOST: zpk.fan.b2.sz.w7.com
      ZPK_ARTIFACT: w7-traditiontool
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Package frontend
        run: |
          set -euo pipefail

          if [ ! -d ui/dist ]; then
            echo "frontend dist not found under ui/dist"
            exit 1
          fi

          cd ui/dist
          zip -r ../../frontend.zip .

      - name: Package Helm chart
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          HELM_CHART_NAME="$(awk '$1 == "name:" { print $2; exit }' charts/Chart.yaml)"
          make helm-package HELM_CHART_VERSION="${RELEASE_VERSION}" HELM_APP_VERSION="${RELEASE_TAG}"
          echo "HELM_PACKAGE=charts/${HELM_CHART_NAME}-${RELEASE_VERSION}.tgz" >> "${GITHUB_ENV}"

      - name: Push zpk
        env:
          ZPK_DOCKER_USERNAME: ${{ secrets.ZPK_DOCKER_USERNAME }}
          ZPK_DOCKER_PASSWORD: ${{ secrets.ZPK_DOCKER_PASSWORD }}
        run: |
          sudo curl -L --fail -o /usr/local/bin/zpk https://github.com/w7panel/w7panel-zpk/releases/download/latest/zpk_linux_amd64
          sudo chmod +x /usr/local/bin/zpk
          
          set -euo pipefail

          if [ -z "${ZPK_DOCKER_USERNAME}" ]; then
            echo "ZPK_DOCKER_USERNAME secret is required"
            exit 1
          fi
          if [ -z "${ZPK_DOCKER_PASSWORD}" ]; then
            echo "ZPK_DOCKER_PASSWORD secret is required"
            exit 1
          fi

          if [ ! -f "${HELM_PACKAGE}" ]; then
            echo "helm package not found: ${HELM_PACKAGE}"
            exit 1
          fi

          zpk login --username="${ZPK_DOCKER_USERNAME}" --password="${ZPK_DOCKER_PASSWORD}" --host="${ZPK_HOST}"
          zpk use "${ZPK_ARTIFACT}"
          zpk attach add --path="${HELM_PACKAGE}" --type=helm
          zpk attach add --path="frontend.zip" --type=frontend
          zpk push

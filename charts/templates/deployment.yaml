{{- $runtime := include "tradition-tool.runtimeConfig" . | fromJson -}}
{{- $container := include "tradition-tool.gatewayContainer" (dict "root" . "enabled" (eq (include "tradition-tool.gatewayEnabled" .) "true")) | fromYaml -}}
{{- $toolPort := .Values.service.port -}}
{{- if $runtime.service -}}
  {{- range $port := $runtime.service.ports -}}
    {{- if and (eq (default "TCP" $port.protocol) "TCP") (eq (default "" $port.name) "http") -}}
      {{- $toolPort = $port.port -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $existing := get $runtime.containers $container.name -}}
{{- if $existing -}}
  {{- range $field := get $runtime.selection.containers $container.name -}}
    {{- if hasKey $existing $field -}}
      {{- $_ := set $container $field (get $existing $field) -}}
    {{- else -}}
      {{- $_ := unset $container $field -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tradition-tool.fullname" . }}
  labels:
    {{- include "tradition-tool.labels" . | nindent 4 }}
  annotations:
    title: 传统应用工具
    w7.cc.app/title: 传统应用工具
    w7.cc/create-svc: 'false'
    {{/* 工具自行声明网关能力与自身 Service；主应用和直连端口由 UI 查询 AppGroup、Service。 */}}
    w7.cc/tradition-gateway: {{ dict "toolService" (include "tradition-tool.fullname" .) "toolPort" $toolPort | toJson | quote }}
    {{/* 两份发布配置用于切换 nginx/pause；当前状态由工具实际运行的容器配置体现。 */}}
    w7.cc/tradition-gateway-containers: {{ dict "enabled" (include "tradition-tool.gatewayContainer" (dict "root" . "enabled" true) | fromYaml) "disabled" (include "tradition-tool.gatewayContainer" (dict "root" . "enabled" false) | fromYaml) | toJson | quote }}
    {{/* 升级时仅沿用工具自身标记的运行配置，未标记字段继续跟随新版 Chart。 */}}
    {{- if $runtime.selection }}
    w7.cc/tradition-runtime-config: {{ $runtime.selection | toJson | quote }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tradition-tool.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        w7.cc/tradition-tool-restart-revision: {{ .Release.Revision | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tradition-tool.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tradition-tool.serviceAccountName" . }}
      runtimeClassName: sysbox-runc
      hostUsers: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - {{ $container | toYaml | nindent 10 | trim }}
      volumes:
        - name: site-storage
          persistentVolumeClaim:
            claimName: {{ .Values.PVC_NAME }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- $runtime := include "tradition-tool.runtimeConfig" . | fromJson -}}
{{- if or .Values.service.enabled $runtime.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tradition-tool.fullname" . }}
  labels:
    {{- include "tradition-tool.labels" . | nindent 4 }}
spec:
  type: {{ if $runtime.service }}{{ $runtime.service.type }}{{ else }}{{ .Values.service.type }}{{ end }}
  ports:
    {{- if $runtime.service }}
    {{- toYaml $runtime.service.ports | nindent 4 }}
    {{- else }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "tradition-tool.selectorLabels" . | nindent 4 }}
{{- end }}

replicaCount: 1

# Run the NGINX gateway. When disabled, the Deployment uses a pause placeholder
# image and does not expose ports. Service creation is controlled separately.
gatewayEnabled: false

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: latest

placeholderImage:
  repository: registry.k8s.io/pause
  tag: "3.10"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

service:
  enabled: true
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

# Workload Pod scheduling affinity.
affinity:
  podAffinity: {}

# Job settings. Reserved for Job templates.
job:
  affinity: {}

PVC_NAME: ""

global:
  NGINX_WEB_DIR: /www/wwwroot
  SERVER_DIR: /www/server
  NGINX_DIR: /www/server/nginx
  NGINX_VHOST_DIR: /www/server/nginx/conf.d
